# Parametri di default per smarthorntest. Modifica qui e salva.
# Le opzioni sulla riga di comando (-t, -d, -l, ...) valgono solo per quel lancio e vincono su questo file.

# Timeout in secondi (1200 = 20 minuti)
TIMEOUT=1200

# Numero massimo di passi di risoluzione. Vuoto = nessun limite pratico (10000000)
MAXDEPTH=100

# Un solo test per ciclo (--stop-first-per-loop): si oppure no
PER_LOOP=no

# Fermarsi al primo test trovato (--stop-first): si oppure no
STOP_FIRST=no

# Funzione da analizzare (solo .sol). Vuoto = la prima funzione del contratto
FUNZIONE=

# Predicato di partenza (solo .pl). Vuoto = lo capisce da solo (incorrect per Yul, ff per SolCMC)
PREDICATO=
